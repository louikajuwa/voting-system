; Application PHP configuration (enterprise MLM)
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
max_input_vars = 5000
date.timezone = UTC
expose_php = Off

; OPcache — production-oriented; JIT-less, safe defaults
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; PHP must NOT print errors into the response (breaks headers/JSON).
; Laravel renders errors itself via APP_DEBUG; PHP just logs them.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
