x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: vote/app:latest
  env_file: .env
  volumes:
    - ./:/var/www/html
  networks: [vote]
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    container_name: vote_app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: vote_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      socket:
        condition: service_healthy
    networks: [vote]

  mysql:
    image: mysql:8.4
    container_name: vote_mysql
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-vote}"
      MYSQL_USER: "${DB_USERNAME:-vote_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-vote_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - vote_mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vote]

  redis:
    image: redis:7-alpine
    container_name: vote_redis
    # Password is optional: unset/empty/"null" REDIS_PASSWORD means no auth (dev only).
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != null ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    volumes:
      - vote_redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != null ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vote]

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: vote_phpmyadmin
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - mysql
    networks: [vote]

  queue:
    <<: *app
    container_name: vote_queue
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    container_name: vote_scheduler
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_started

  socket:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    image: vote/socket:latest
    container_name: vote_socket
    environment:
      SOCKET_PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      SOCKET_CHANNEL: "${SOCKET_CHANNEL:-vote.events}"
      SOCKET_SECRET: "${SOCKET_SECRET:-}"
    depends_on:
      redis:
        condition: service_healthy
    networks: [vote]

volumes:
  vote_mysql:
  vote_redis:

networks:
  vote:
    driver: bridge
